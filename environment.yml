name: targettrace
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # Core scientific stack
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  # PyTorch — install CPU build by default; override with cudatoolkit if GPU available
  - pytorch>=2.0
  - torchvision
  # Chemistry
  - rdkit>=2023.3.1
  # pip-only packages
  - pip:
    - streamlit>=1.35.0
    - chembl-webresource-client>=0.10.9
    - transformers>=4.35.0
    - altair>=5.0.0
    - requests>=2.31.0
    - tqdm>=4.65.0
